[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pathfinder-phish"
dynamic = ["version"]
description = "Phishing & URL analysis — scout a suspicious URL or email, score it, and hand the indicators it finds to Station for enrichment."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Derek Gannon" }]
keywords = ["phishing", "url-analysis", "cti", "threat-intelligence", "osint", "detection"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = [
  "requests>=2.31.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/FarfallaJ/pathfinder"
Repository = "https://github.com/FarfallaJ/pathfinder"

[project.scripts]
pathfinder = "pathfinder.cli:main"

[tool.setuptools.dynamic]
version = { attr = "pathfinder.__version__" }

[tool.setuptools.packages.find]
include = ["pathfinder*"]
